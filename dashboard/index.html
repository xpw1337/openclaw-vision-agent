<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenClaw Area Awareness</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">OpenClaw Vision Agent</p>
          <h1>Area Awareness Dashboard</h1>
          <p id="status" class="muted">Waiting for fused area state...</p>
        </div>
        <div class="stats">
          <div>
            <span id="camera-total">0</span>
            <label>Cameras</label>
          </div>
          <div>
            <span id="stale-total">0</span>
            <label>Stale</label>
          </div>
          <div>
            <span id="zone-total">0</span>
            <label>Zones</label>
          </div>
        </div>
      </header>

      <section id="zones" class="zones" aria-live="polite"></section>
    </main>

    <template id="empty-template">
      <section class="empty">
        <h2>No live area snapshot yet</h2>
        <p>Samplers are intentionally off by default. The dashboard will populate after an explicit live run starts and observations reach Fusion.</p>
      </section>
    </template>

    <script src="/static/app.js" defer></script>
  </body>
</html>
