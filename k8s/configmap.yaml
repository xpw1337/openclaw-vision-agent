apiVersion: v1
kind: ConfigMap
metadata:
  name: vision-agent-config
  namespace: surveillance
data:
  MODEL_NAME: "gemini-3.5-flash"
  NATS_URL: "nats://nats.surveillance.svc:4222"
  JOBS_SUBJECT: "jobs.images"
  OBS_SUBJECT: "observations"
  DLQ_SUBJECT: "jobs.dlq"
  QUEUE_GROUP: "workers"
  HEALTH_PORT: "8080"
  METRICS_PORT: "9102"
  JETSTREAM_ENABLED: "true"
  JOBS_STREAM: "JOBS"
  JOBS_CONSUMER: "workers"
  DLQ_STREAM: "JOBS_DLQ"
  MAX_RETRIES: "2"
  RETRY_BASE_DELAY_SECONDS: "1"
  RETRY_MAX_DELAY_SECONDS: "15"
  # Week 2: fusion + sampler tuning (password injected separately from a Secret).
  DATABASE_URL: "postgresql://postgres@postgres.surveillance.svc:5432/surveillance"
  REDIS_URL: "redis://redis.surveillance.svc:6379/0"
  SAMPLE_INTERVAL_SECONDS: "60"
