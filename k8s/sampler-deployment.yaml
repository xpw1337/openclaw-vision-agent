# Per-camera frame samplers. Four cameras across three zones; the dock zone has
# two cameras to demonstrate multi-camera-into-one-zone fusion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampler-cam-dock-1
  namespace: surveillance
  labels:
    app: sampler
    camera: cam-dock-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sampler
      camera: cam-dock-1
  template:
    metadata:
      labels:
        app: sampler
        camera: cam-dock-1
    spec:
      containers:
        - name: sampler
          image: k3d-registry.localhost:5000/vision-sampler:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: vision-agent-config
          env:
            - name: CAMERA_ID
              value: cam-dock-1
            - name: ZONE
              value: dock
            - name: CLIP_PATH
              value: /app/data/clips/cam-dock-1.avi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
