---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampler-cam-dock-1
  namespace: surveillance
  labels:
    app: sampler
    camera: cam-dock-1
    zone: dock
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sampler
      camera: cam-dock-1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9102"
      labels:
        app: sampler
        camera: cam-dock-1
        zone: dock
    spec:
      containers:
        - name: sampler
          image: k3d-registry.localhost:5000/vision-sampler:dev
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: vision-agent-config
          env:
            - name: CAMERA_ID
              value: "cam-dock-1"
            - name: CAMERA_DISPLAY_NAME
              value: "Dock 1"
            - name: ZONE
              value: "dock"
            - name: CLIP_PATH
              value: "/app/data/clips/cam-dock-1.avi"
          ports:
            - name: metrics
              containerPort: 9102
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
